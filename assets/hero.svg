<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090014"/>
      <stop offset="0.35" stop-color="#2a0a5e"/>
      <stop offset="0.62" stop-color="#9b1d8f"/>
      <stop offset="0.8" stop-color="#ff4f7b"/>
      <stop offset="0.92" stop-color="#ffa24c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset="0.45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0040"/>
      <stop offset="1" stop-color="#05000d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffd1f5"/>
      <stop offset="0.55" stop-color="#ff5ecf"/>
      <stop offset="1" stop-color="#ff9e00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- bandes du soleil qui défilent -->
    <mask id="sunmask">
      <rect width="1200" height="450" fill="#fff"/>
      <g fill="#000">
        <rect x="0" y="200" width="1200" height="4"><animate attributeName="y" values="200;290" dur="4s" repeatCount="indefinite"/><animate attributeName="height" values="2;12" dur="4s" repeatCount="indefinite"/></rect>
        <rect x="0" y="222" width="1200" height="6"><animate attributeName="y" values="222;312" dur="4s" begin="-1s" repeatCount="indefinite"/><animate attributeName="height" values="4;14" dur="4s" begin="-1s" repeatCount="indefinite"/></rect>
        <rect x="0" y="245" width="1200" height="8"><animate attributeName="y" values="200;290" dur="4s" begin="-2s" repeatCount="indefinite"/><animate attributeName="height" values="2;12" dur="4s" begin="-2s" repeatCount="indefinite"/></rect>
        <rect x="0" y="268" width="1200" height="10"><animate attributeName="y" values="200;290" dur="4s" begin="-3s" repeatCount="indefinite"/><animate attributeName="height" values="2;12" dur="4s" begin="-3s" repeatCount="indefinite"/></rect>
      </g>
    </mask>
    <clipPath id="abovehorizon"><rect width="1200" height="300"/></clipPath>
    <clipPath id="belowhorizon"><rect y="300" width="1200" height="150"/></clipPath>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="450" rx="24"/></clipPath>
    <clipPath id="tclip">
      <text x="600" y="190" text-anchor="middle" font-family="Impact, 'Arial Black', 'Segoe UI Black', sans-serif" font-size="118" letter-spacing="6">TIRETINIUM</text>
    </clipPath>

    <!-- palmier réutilisable (base en 0,0) -->
    <g id="palm" fill="#0d0019">
      <path d="M-6 0 C -2 -70, 6 -140, 26 -215 L 34 -213 C 16 -140, 10 -70, 8 0 Z"/>
      <g transform="translate(30 -214)">
        <path d="M0 0 C -30 -30, -80 -30, -120 5 C -80 -12, -40 -8, 0 0 Z"/>
        <path d="M0 0 C -20 -45, -60 -70, -100 -60 C -60 -50, -30 -30, 0 0 Z"/>
        <path d="M0 0 C 10 -45, 40 -70, 70 -72 C 45 -55, 20 -35, 0 0 Z"/>
        <path d="M0 0 C 35 -30, 85 -30, 125 0 C 85 -14, 45 -10, 0 0 Z"/>
        <path d="M0 0 C 30 -5, 75 20, 95 60 C 65 30, 35 12, 0 0 Z"/>
        <path d="M0 0 C -30 -2, -75 25, -90 65 C -62 35, -32 15, 0 0 Z"/>
        <circle cx="0" cy="4" r="7"/>
      </g>
    </g>

    <style>
      .tw { animation: tw 3s ease-in-out infinite; }
      .tw2 { animation-delay: -1s } .tw3 { animation-delay: -2s }
      @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      .win { animation: win 2.6s steps(1) infinite; }
      .w2 { animation-delay: -.7s } .w3 { animation-delay: -1.4s } .w4 { animation-delay: -2s }
      @keyframes win { 0%,100% { opacity: 1 } 40% { opacity: .15 } 70% { opacity: .8 } }
      .sweep { animation: sweep 3s linear infinite; transform-origin: 70px 70px; }
      @keyframes sweep { to { transform: rotate(360deg) } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .sub { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: 6px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- ciel -->
    <rect width="1200" height="300" fill="url(#sky)"/>
    <g fill="#fff">
      <circle class="tw" cx="80" cy="40" r="1.6"/><circle class="tw tw2" cx="210" cy="90" r="1.2"/>
      <circle class="tw tw3" cx="330" cy="30" r="1.8"/><circle class="tw" cx="460" cy="70" r="1.1"/>
      <circle class="tw tw2" cx="760" cy="35" r="1.5"/><circle class="tw tw3" cx="880" cy="85" r="1.2"/>
      <circle class="tw" cx="1010" cy="45" r="1.7"/><circle class="tw tw2" cx="1130" cy="100" r="1.3"/>
      <circle class="tw tw3" cx="560" cy="20" r="1"/><circle class="tw" cx="660" cy="60" r="1.2"/>
      <circle class="tw tw2" cx="150" cy="140" r="1"/><circle class="tw tw3" cx="1060" cy="150" r="1"/>
    </g>

    <!-- soleil -->
    <ellipse cx="600" cy="230" rx="420" ry="200" fill="url(#haze)"/>
    <g clip-path="url(#abovehorizon)">
      <circle cx="600" cy="215" r="165" fill="#ff5ecf" filter="url(#bigglow)" opacity=".7"/>
      <circle cx="600" cy="215" r="150" fill="url(#sun)" mask="url(#sunmask)"/>
    </g>

    <!-- skyline -->
    <g fill="#16032c">
      <rect x="250" y="250" width="40" height="50"/><rect x="295" y="225" width="30" height="75"/>
      <rect x="330" y="240" width="45" height="60"/><rect x="380" y="200" width="26" height="100"/>
      <polygon points="380,200 393,180 406,200"/>
      <rect x="410" y="235" width="50" height="65"/><rect x="465" y="255" width="35" height="45"/>
      <rect x="700" y="250" width="40" height="50"/><rect x="745" y="215" width="34" height="85"/>
      <rect x="784" y="190" width="28" height="110"/><rect x="816" y="235" width="48" height="65"/>
      <rect x="868" y="208" width="30" height="92"/><rect x="902" y="250" width="44" height="50"/>
    </g>
    <g fill="#ffd166">
      <rect class="win" x="300" y="235" width="4" height="4"/><rect class="win w2" x="314" y="250" width="4" height="4"/>
      <rect class="win w3" x="387" y="215" width="4" height="4"/><rect class="win w4" x="395" y="240" width="4" height="4"/>
      <rect class="win w2" x="420" y="248" width="4" height="4"/><rect class="win" x="440" y="262" width="4" height="4"/>
      <rect class="win w3" x="752" y="228" width="4" height="4"/><rect class="win" x="766" y="250" width="4" height="4"/>
      <rect class="win w4" x="792" y="205" width="4" height="4"/><rect class="win w2" x="800" y="232" width="4" height="4"/>
      <rect class="win w3" x="830" y="250" width="4" height="4"/><rect class="win" x="876" y="222" width="4" height="4"/>
    </g>

    <!-- sol + grille 3D en perspective -->
    <rect y="300" width="1200" height="150" fill="url(#ground)"/>
    <g clip-path="url(#belowhorizon)" stroke="#ff2bd6" stroke-width="2" filter="url(#glow)">
      <g stroke-opacity=".8">
        <line x1="600" y1="300" x2="-1200" y2="450"/><line x1="600" y1="300" x2="-900" y2="450"/>
        <line x1="600" y1="300" x2="-600" y2="450"/><line x1="600" y1="300" x2="-300" y2="450"/>
        <line x1="600" y1="300" x2="0" y2="450"/><line x1="600" y1="300" x2="200" y2="450"/>
        <line x1="600" y1="300" x2="400" y2="450"/><line x1="600" y1="300" x2="600" y2="450"/>
        <line x1="600" y1="300" x2="800" y2="450"/><line x1="600" y1="300" x2="1000" y2="450"/>
        <line x1="600" y1="300" x2="1200" y2="450"/><line x1="600" y1="300" x2="1500" y2="450"/>
        <line x1="600" y1="300" x2="1800" y2="450"/><line x1="600" y1="300" x2="2100" y2="450"/>
        <line x1="600" y1="300" x2="2400" y2="450"/>
      </g>
      <line x1="0" x2="1200" y1="300" y2="300"><animate attributeName="y1" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" repeatCount="indefinite"/><animate attributeName="y2" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="300" y2="300"><animate attributeName="y1" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-.5s" repeatCount="indefinite"/><animate attributeName="y2" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-.5s" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="300" y2="300"><animate attributeName="y1" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-1s" repeatCount="indefinite"/><animate attributeName="y2" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-1s" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="300" y2="300"><animate attributeName="y1" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-1.5s" repeatCount="indefinite"/><animate attributeName="y2" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-1.5s" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="300" y2="300"><animate attributeName="y1" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-2s" repeatCount="indefinite"/><animate attributeName="y2" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-2s" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="300" y2="300"><animate attributeName="y1" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="y2" values="300;452" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 1" dur="3s" begin="-2.5s" repeatCount="indefinite"/></line>
    </g>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#ffb3ec" stroke-width="2.5" filter="url(#glow)"/>

    <!-- palmiers qui se balancent -->
    <g transform="translate(95 330) scale(1.15)">
      <g><use xlink:href="#palm"/><animateTransform attributeName="transform" type="rotate" values="-2;3;-2" dur="6s" repeatCount="indefinite"/></g>
    </g>
    <g transform="translate(190 345) scale(.8) rotate(-8)">
      <g><use xlink:href="#palm"/><animateTransform attributeName="transform" type="rotate" values="2;-3;2" dur="5s" repeatCount="indefinite"/></g>
    </g>
    <g transform="translate(1110 335) scale(-1.15 1.15)">
      <g><use xlink:href="#palm"/><animateTransform attributeName="transform" type="rotate" values="-3;2;-3" dur="6.5s" repeatCount="indefinite"/></g>
    </g>
    <g transform="translate(1010 350) scale(-.75 .75) rotate(-6)">
      <g><use xlink:href="#palm"/><animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="5.5s" repeatCount="indefinite"/></g>
    </g>

    <!-- titre extrudé en 3D -->
    <g class="float" font-family="Impact, 'Arial Black', 'Segoe UI Black', sans-serif" font-size="118" letter-spacing="6" text-anchor="middle">
      <text x="611" y="201" fill="#1a0030">TIRETINIUM</text>
      <text x="610" y="200" fill="#26003f">TIRETINIUM</text>
      <text x="609" y="199" fill="#33004d">TIRETINIUM</text>
      <text x="608" y="198" fill="#42005a">TIRETINIUM</text>
      <text x="607" y="197" fill="#520866">TIRETINIUM</text>
      <text x="606" y="196" fill="#630f70">TIRETINIUM</text>
      <text x="605" y="195" fill="#74167a">TIRETINIUM</text>
      <text x="604" y="194" fill="#861d82">TIRETINIUM</text>
      <text x="603" y="193" fill="#98248a">TIRETINIUM</text>
      <text x="602" y="192" fill="#a92b90">TIRETINIUM</text>
      <text x="601" y="191" fill="#ba3296">TIRETINIUM</text>
      <text x="600" y="190" fill="url(#title)" stroke="#fff" stroke-width="1.5" filter="url(#glow)">TIRETINIUM</text>
      <g clip-path="url(#tclip)">
        <rect x="-300" y="80" width="180" height="140" fill="url(#shine)" transform="skewX(-20)">
          <animate attributeName="x" values="-300;-300;1500" keyTimes="0;.55;1" dur="4.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <text x="600" y="248" text-anchor="middle" class="sub" font-size="20" fill="#fff" filter="url(#glow)">BUT INFORMATIQUE · 3ᵉ ANNÉE</text>
    <text x="600" y="282" text-anchor="middle" class="sub" font-size="17" fill="#ffd166">ALTERNANT @ THALES DMS</text>

    <!-- HUD : radar -->
    <g transform="translate(24 24)">
      <circle cx="70" cy="70" r="58" fill="#0a0018" fill-opacity=".75" stroke="#ff2bd6" stroke-width="2"/>
      <circle cx="70" cy="70" r="38" fill="none" stroke="#ff2bd6" stroke-opacity=".35"/>
      <circle cx="70" cy="70" r="18" fill="none" stroke="#ff2bd6" stroke-opacity=".35"/>
      <line x1="12" y1="70" x2="128" y2="70" stroke="#ff2bd6" stroke-opacity=".25"/>
      <line x1="70" y1="12" x2="70" y2="128" stroke="#ff2bd6" stroke-opacity=".25"/>
      <path class="sweep" d="M70 70 L70 12 A58 58 0 0 1 120 41 Z" fill="#ff2bd6" fill-opacity=".35"/>
      <circle cx="95" cy="50" r="4" fill="#ffd166" class="blink"/>
      <circle cx="50" cy="92" r="3" fill="#00f5ff"/>
      <polygon points="70,62 76,78 70,74 64,78" fill="#fff"/>
    </g>

    <!-- HUD : coin haut droit -->
    <g transform="translate(1176 52)" text-anchor="end" class="sub">
      <text font-size="30" fill="#7dff8a" stroke="#05200a" stroke-width="1" letter-spacing="2">$ 0 BUG</text>
      <text y="30" font-size="14" fill="#fff" letter-spacing="3">LVL 3 · ALTERNANCE</text>
      <g transform="translate(-8 52)" fill="#ffd166">
        <polygon points="0,-9 2.6,-3 9,-3 3.8,1.5 6,8.5 0,4.5 -6,8.5 -3.8,1.5 -9,-3 -2.6,-3"/>
        <polygon transform="translate(-24 0)" points="0,-9 2.6,-3 9,-3 3.8,1.5 6,8.5 0,4.5 -6,8.5 -3.8,1.5 -9,-3 -2.6,-3"/>
        <polygon transform="translate(-48 0)" points="0,-9 2.6,-3 9,-3 3.8,1.5 6,8.5 0,4.5 -6,8.5 -3.8,1.5 -9,-3 -2.6,-3"/>
        <polygon class="blink" transform="translate(-72 0)" points="0,-9 2.6,-3 9,-3 3.8,1.5 6,8.5 0,4.5 -6,8.5 -3.8,1.5 -9,-3 -2.6,-3"/>
        <polygon transform="translate(-96 0)" fill="#ffffff" fill-opacity=".25" points="0,-9 2.6,-3 9,-3 3.8,1.5 6,8.5 0,4.5 -6,8.5 -3.8,1.5 -9,-3 -2.6,-3"/>
      </g>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="447" rx="23" fill="none" stroke="#ff2bd6" stroke-opacity=".6" stroke-width="3"/>
</svg>
