<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="glass" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#0b2414"/><stop offset=".7" stop-color="#06100a"/><stop offset="1" stop-color="#020604"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".35"/></pattern>
    <style>text { font-family: 'Courier New', 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #3dff86; } .dim { fill: #2fb866; } .b { font-weight: 700; }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }</style>
  </defs>
  <rect width="1200" height="200" rx="16" fill="#151515"/>
  <rect x="20" y="20" width="1160" height="160" rx="22" fill="url(#glass)"/>
  <g filter="url(#glow)">
    <text x="52" y="58" font-size="22" class="b" letter-spacing="3">DERNIERS JEUX</text>
    <text x="1148" y="58" font-size="14" text-anchor="end" class="dim">SIGNAL PLAYSTATION</text>
    <line x1="52" y1="72" x2="1148" y2="72" stroke="#1d7a43"/>
    <text x="56" y="124" font-size="17">EN ATTENTE DU SIGNAL PSN<tspan class="blink">_</tspan></text><text x="56" y="154" font-size="13" class="dim">Le terminal réessaiera au prochain passage.</text>
  </g>
  <rect x="20" y="20" width="1160" height="160" rx="22" fill="url(#scan)"/>
  <rect x="20" y="20" width="1160" height="160" rx="22" fill="none" stroke="#1d7a43" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
