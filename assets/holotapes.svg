      .roll { animation: roll 5s linear infinite; }
      @keyframes roll { from { transform: translateY(-120px) } to { transform: translateY(420px) } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
